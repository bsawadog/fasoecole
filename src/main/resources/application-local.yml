# Profil LOCAL : développement sur poste, base Postgres via docker-compose.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/fasoecoleBD
    username: fasoecole_bd_user
    password: fasoecole_bd_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    locations: classpath:db/migration,classpath:db/local

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4202,http://127.0.0.1:4202}
  mail:
    # Local test accounts can use fictitious addresses; all mail goes to this inbox.
    local-recipient: ${MAIL_TEST_RECIPIENT:boubacar.sawadogo02@gmail.com}

jwt:
  # Secret de développement uniquement - ne jamais utiliser en dev/prod
  secret: "ZmFzb2Vjb2xlLWxvY2FsLXNlY3JldC1rZXktZm9yLWRldi1vbmx5LTI1NmJpdHM="

logging:
  level:
    org.afritechinnovations: DEBUG
    org.hibernate.SQL: DEBUG
